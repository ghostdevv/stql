<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="modulepreload" href="https://esm.sh/stql@0.3.1" />
		<script type="importmap">
			{
				"imports": {
					"stql": "https://esm.sh/stql@0.3.1"
				}
			}
		</script>
	</head>
	<body>
		<p>running</p>

		<script type="module">
			const METHODS = ['log', 'warn', 'error', 'info'];

			function send(type, data) {
				parent.postMessage(
					{
						id: __RUNNER_ID__,
						type,
						ts: Date.now(),
						...data,
					},
					__RUNNER_ORIGIN__,
				);
			}

			function sendError(error) {
				if (error instanceof Error) {
					let message = error.message;
					message += error.stack ? `\n\n${error.stack}` : '';
					message = message.replaceAll(
						__RUNNER_CODE__,
						'__user_code',
					);
					send('error', { message });
				} else {
					send('error', { message: String(error) });
				}
			}

			for (const method of METHODS) {
				const original = console[method];
				console[method] = function (...args) {
					try {
						send('console', { method, args });
					} catch (error) {
						console.error('failed to send console message:', error);
						sendError(error);
					}

					return original.call(this, ...args);
				};
			}

			window.addEventListener('error', (event) => {
				sendError(event.error);
			});
		</script>

		<script type="module">
			await import(__RUNNER_CODE__);
		</script>
	</body>
</html>
